; Midimalism 2 — PlatformIO build
;
; Self-contained: the CocoMake7 "teenyriot" Arduino core, the V-USB driver and
; EEPROM are vendored in lib/, so nothing depends on the Arduino IDE's
; CocoMake7 board package (whose CocoMidi/usbconfig.h is what made the device
; enumerate as "TeenageUSB").
;
; Build:   pio run
; Upload:  pio run -t upload      (via the USBasp-compatible bootloader, -D = keep bootloader)

[env:midimalism]
platform = atmelavr
board = attiny85
; no `framework =` on purpose: the core comes from lib/teenyriot-core
board_build.mcu = attiny85
board_build.f_cpu = 16500000L
; 0x14FA: above that sit the bootloader's checksum byte and saved vectors
; (CocoMake7's boards.txt sIm ays 5375, which would let a sketch overwrite them)
board_upload.maximum_size = 5370

build_flags =
  ; make include/usbconfig.h visible to lib/vusb as well (it has no copy of its own)
  -I include
  -DARDUINO=10819
  -DARDUINO_AVR_COCOMAKE7
  -DARDUINO_ARCH_AVR
  -std=gnu++11
  -fno-threadsafe-statics
build_unflags = -std=gnu++17 -std=gnu++14

; link library objects directly (like the Arduino IDE does for libraries), so
; nothing such as the V-USB interrupt handler can be dropped from an archive
lib_archive = no
; no framework is set, so tell the dependency finder not to reject the vendored libs
lib_compat_mode = off

; Upload through the teenyriot-usbtiny bootloader (a USBasp emulator at 0x1500).
; tools/midimalism_upload.py sends the SysEx kick F0 08 F7 to the Midimalism MIDI
; port so the firmware restarts into the bootloader, then runs
; avrdude -c usbasp -D until the bootloader answers. No kickable port found ->
; it asks you to replug. Extra options go in upload_flags, e.g. --no-kick.
upload_protocol = custom
extra_scripts = post:tools/pio_upload.py

; First flash of a blank chip with a real USBasp programmer
; (bootloader + sketch + fuses):  pio run -t bootstrap   (see README.md)
